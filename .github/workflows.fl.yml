Execution Flow
 * Continuous AST Sweeping: Before the compiler is even invoked, the script scans the raw text/AST for forbidden patterns (like FUTEX_WAIT_PRIVATE which would hang the /dev/shm IPC bridge, or unsafe call.value execution).
 * In-Place Mutation: If a violation is found, it dynamically rewrites the file in memory, commits the patch to disk, and immediately jumps back to the start of the while loop to re-verify the fix didn't break surrounding logic.
 * Strict Compilation Gate: Once the AST is clean, it attempts a strict -Werror C++23 compilation. If the compiler throws an error (e.g., missing headers or mismatched types), the script catches the stderr, parses the missing dependency, injects the fix, and loops again.
 * Absolute Resolution: The loop only terminates and returns True when both the static analyzer and the native compiler return a flawless state (returncode == 0 and len(ast_findings) == 0).
 The continuous auto-remediation loop effectively closes the gap between the AST security linter and the strict C++23 compiler, ensuring that the node never deploys with broken futex synchronization or vulnerable execution patterns. By running this closed-loop heuristic engine, the pipeline guarantees absolute resolution before the orchestrator ever releases the build.
