use std::sync::OnceLock;
use std::ptr;

// Mock ML-DSA-65 layout for demonstration (ML-DSA-65 PK is 1952 bytes)
pub struct MlDsa65KeyPair {
    pub public_key: [u8; 1952],
    _secret_key: [u8; 4032],
}

impl MlDsa65KeyPair {
    fn generate_session_key() -> Self {
        // In production, this binds to the hardware Q-PUF or secure enclave
        MlDsa65KeyPair {
            public_key: [42; 1952], 
            _secret_key: [0; 4032],
        }
    }
}

// Persist the FFI signing key across requests in a thread-safe static lock
static SESSION_KEY: OnceLock<MlDsa65KeyPair> = OnceLock::new();

/// Exports the ML-DSA-65 Public Key to the C++/Go Caller.
/// Returns the number of bytes written, or a distinct negative error code.
#[no_mangle]
pub extern "C" fn sq_crypto_export_mldsa_pk(out_buffer: *mut u8, max_len: usize) -> isize {
    // 1. Differentiate Null Pointer Errors
    if out_buffer.is_null() {
        return -1; 
    }

    // 2. Initialize or retrieve the session keypair
    let keypair = SESSION_KEY.get_or_init(MlDsa65KeyPair::generate_session_key);
    let pk = &keypair.public_key;

    // 3. Differentiate Capacity Errors
    if max_len < pk.len() {
        return -2; 
    }

    // 4. Safely copy to the caller's pre-allocated C/C++ buffer
    unsafe {
        ptr::copy_nonoverlapping(pk.as_ptr(), out_buffer, pk.len());
    }

    pk.len() as isize
}

