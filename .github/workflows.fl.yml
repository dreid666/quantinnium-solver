            "uncorrected_fidelity": round(uncorrected_fidelity, 8),
            "stabilized_fidelity": round(final_fidelity, 12),
            "residual_fluctuation": float(f"{residual_fluctuation:.2e}"),
            "meets_fidelity_floor": final_fidelity >= FIDELITY_FLOOR,
            "max_substep_unitarity_error": float(f"{max_unitarity_err:.2e}"),
            "within_machine_epsilon": max_unitarity_err <= UNITARITY_CEILING,
            "total_cascade_ns": round(total_ns, 2),
            "total_budget_ns": TOTAL_BUDGET_NS,
            "all_18g_x_12t_deadlines_passed": all(item["timing_pass"] for item in gate_summaries),
            "gate_18x12_telemetry": gate_summaries,
        }

        # 5. Commit tamper-evident state digest to air-gapped SQLite WAL
        with tempfile.TemporaryDirectory() as tmpdir:
            db_path = os.path.join(tmpdir, "qlnn_18x18x12.db")
            conn = sqlite3.connect(db_path)
            conn.execute("PRAGMA journal_mode=WAL;")
