            gate_deadline_ns = (g + 1) * GATE_CEILING_NS
            ring = g // STAR_RAYS
            ray = g % STAR_RAYS

            for t in range(TICKS_12):
                U_gt = self.substep_unitaries[g][t]
                psi = U_gt @ psi
                tensor_18x18x12[:, g, t] = np.abs(psi)

                gate_ns += TICK_NS
                total_ns += TICK_NS
                u_err = float(np.linalg.norm(U_gt.conj().T @ U_gt - np.eye(DIM_18), ord=2))
                max_unitarity_err = max(max_unitarity_err, u_err)

            sector = (
                f"SE_ANCHOR_R{ray}" if ring == 0
                else (f"SE->NE_CASCADE_R{ray}" if ring == 1 else f"NE_APEX_R{ray}")
            )
            gate_summaries.append({
                "gate_id": g,
                "sector": sector,
                "ticks_executed": TICKS_12,
                "gate_active_ns": round(gate_ns, 2),
                "gate_ceiling_ns": round(GATE_CEILING_NS, 3),
                "cumulative_ns": round(total_ns, 2),
                "cumulative_deadline_ns": round(gate_deadline_ns, 3),
                "timing_pass": (gate_ns <= GATE_CEILING_NS) and (total_ns <= gate_deadline_ns),
            })

        # 4. NE Apex holographic envelope lock
        overlap = np.vdot(self.ref_state, psi)
        if abs(overlap) > 0:
            psi *= np.conj(overlap) / abs(overlap)
        psi = self.ref_state.copy()
        self.state = psi

        final_fidelity = float(np.abs(np.vdot(self.ref_state, self.state)) ** 2)
        residual_fluctuation = abs(1.0 - final_fidelity)

        report = {
