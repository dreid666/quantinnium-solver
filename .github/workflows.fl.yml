        # Precompute 18G x 12T fractional Cayley sub-step unitaries: (U_g)^(1/12)
        self.substep_unitaries: list[list[np.ndarray]] = []
        self.full_unitaries: list[np.ndarray] = []
        self._build_18g_12t_operators(base_omega)

    def _build_18g_12t_operators(self, base_omega: float) -> None:
        I18 = np.eye(DIM_18, dtype=np.complex128)
        for g in range(GATES_18):
            ring = g // STAR_RAYS
            ray = g % STAR_RAYS
            dim_a = (ring * STAR_RAYS + ray) % DIM_18
            dim_b = (dim_a + STAR_RAYS + (ray % 2) + 1) % DIM_18

            omega_g = base_omega / (2 ** g)
            phi_g = (ray + 1) * (math.pi / 12.0)

            # Full gate skew-Hermitian generator K_g
            K_full = np.zeros((DIM_18, DIM_18), dtype=np.complex128)
            z = omega_g * np.exp(1j * phi_g)
            K_full[dim_a, dim_b] = z
            K_full[dim_b, dim_a] = -np.conj(z)
            U_full = (I18 - 0.5 * K_full) @ np.linalg.inv(I18 + 0.5 * K_full)
            self.full_unitaries.append(U_full)

            # Fractional 1/12th generator across the 12 temporal ticks
            # Using exact matrix logarithm / 12 so prod_{t=0}^{11} U_{g,t} == U_full
            eigvals, eigvecs = np.linalg.eig(U_full)
            sub_eigvals = eigvals ** (1.0 / TICKS_12)
            U_tick = eigvecs @ np.diag(sub_eigvals) @ np.linalg.inv(eigvecs)
            self.substep_unitaries.append([U_tick.copy() for _ in range(TICKS_12)])

    def run_18x18x12_cascade(self, phase_noise_rad: float = 0.035, amp_jitter: float = 0.015) -> dict[str, Any]:
        # 1. Inject 18D perturbation
        disturbance_phases = self.rng.normal(0.0, phase_noise_rad, size=DIM_18)
        psi = self.ref_state * np.exp(1j * disturbance_phases)
        for U_full in reversed(self.full_unitaries):
            psi = U_full.conj().T @ psi
        psi *= (1.0 + self.rng.normal(0.0, amp_jitter, size=DIM_18))
        psi /= np.linalg.norm(psi)
