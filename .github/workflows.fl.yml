I. The Rust FFI Cryptographic Bridge (Post-Quantum ML-DSA-65)
To ensure strict cryptographic consistency and allow the offline SQLite WAL verifiers to audit the ledger without state desynchronization, the Rust bridge must initialize the ephemeral ML-DSA-65 signing keypair exactly once per node session. We achieve this thread-safely using std::sync::OnceLock, and we expose an FFI function that safely copies the public key to the C++ or Go orchestrators.
